<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ключ и Дверь</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            image-rendering: pixelated;
        }
        canvas {
            border: 4px solid #ff6b6b;
            background: #2d2d44;
            box-shadow: none;
            border-radius: 0;
            image-rendering: pixelated;
        }
        #ui {
            margin-bottom: 15px;
            text-align: center;
            background: #16213e;
            padding: 15px 30px;
            border-radius: 0;
            border: 2px solid #ff6b6b;
        }
        #message {
            margin-top: 15px;
            font-size: 20px;
            color: #ffd700;
            font-weight: bold;
        }
        h1 {
            color: #ff6b6b;
            margin: 0 0 10px 0;
        }
        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🔑 КЛЮЧ И ДВЕРЬ 🚪</h1>
        <p>Управление: Стрелки или WASD | Возьми ключ и открой дверь! Избегай монстров!</p>
        <p id="levelInfo">Уровень: 1</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="message">Найди ключ!</div>

    <script>
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_SPEED = 4;
        const PLAYER_SIZE = 30;
        
        const COLORS = {
            FLOOR: '#2d2d44',
            WALL: '#ff6b6b',
            PLAYER: '#00ff88',
            KEY: '#ffd700',
            DOOR_LOCKED: '#ff6b6b',
            DOOR_OPEN: '#4ecdc4',
            MONSTER: '#ff00ff'
        };

        const MONSTER_CHASE_DISTANCE = 150;
        const MONSTER_CHASE_SPEED = 2.5;

        let canvas, ctx;
        let player = { x: 50, y: 50 };
        let key = { x: 0, y: 0, width: 20, height: 20, taken: false };
        let door = { x: 0, y: 0, width: 40, height: 60, open: false };
        let walls = [];
        let monsters = [];
        let keysPressed = {};
        let won = false;
        let currentLevel = 1;
        let maxLevels = 5;
        
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            
            document.addEventListener('keydown', (e) => {
                keysPressed[e.code] = true;
                if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            });
            document.addEventListener('keyup', (e) => keysPressed[e.code] = false);
            
            initLevel(currentLevel);
            gameLoop();
        };

        function getLevelData(level) {
            const levels = [
                // Уровень 1 - простой обучающий
                {
                    playerStart: { x: 50, y: 50 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: CANVAS_HEIGHT / 2 },
                    doorPos: { x: CANVAS_WIDTH - 100, y: CANVAS_HEIGHT - 80 },
                    walls: [
                        { x: 200, y: 0, width: 20, height: 300 },
                        { x: 400, y: 300, width: 20, height: 300 },
                        { x: 600, y: 0, width: 20, height: 250 }
                    ],
                    monsters: []
                },
                // Уровень 2 - один монстр
                {
                    playerStart: { x: 50, y: 50 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: CANVAS_HEIGHT - 80 },
                    doorPos: { x: 80, y: CANVAS_HEIGHT - 100 },
                    walls: [
                        { x: 150, y: 0, width: 20, height: 250 },
                        { x: 300, y: 150, width: 350, height: 20 },
                        { x: 500, y: 350, width: 20, height: 250 }
                    ],
                    monsters: [
                        { x: 400, y: 200, width: 35, height: 35, speedX: 2, speedY: 0, minX: 250, maxX: 550, minY: 180, maxY: 280 }
                    ]
                },
                // Уровень 3 - открытая арена с двумя монстрами
                {
                    playerStart: { x: 50, y: 300 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: 300 },
                    doorPos: { x: CANVAS_WIDTH - 100, y: 50 },
                    walls: [
                        { x: 200, y: 0, width: 20, height: 200 },
                        { x: 200, y: 400, width: 20, height: 200 },
                        { x: 400, y: 0, width: 20, height: 150 },
                        { x: 400, y: 450, width: 20, height: 150 },
                        { x: 600, y: 200, width: 20, height: 200 }
                    ],
                    monsters: [
                        { x: 300, y: 100, width: 35, height: 35, speedX: 0, speedY: 2, minX: 280, maxX: 380, minY: 50, maxY: 250 },
                        { x: 500, y: 400, width: 35, height: 35, speedX: 2.5, speedY: 0, minX: 480, maxX: 680, minY: 380, maxY: 480 }
                    ]
                },
                // Уровень 4 - лабиринт с тремя монстрами
                {
                    playerStart: { x: 50, y: 50 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: CANVAS_HEIGHT - 80 },
                    doorPos: { x: 50, y: CANVAS_HEIGHT - 100 },
                    walls: [
                        { x: 120, y: 0, width: 20, height: 300 },
                        { x: 240, y: 300, width: 20, height: 300 },
                        { x: 360, y: 0, width: 20, height: 250 },
                        { x: 480, y: 250, width: 20, height: 350 },
                        { x: 600, y: 0, width: 20, height: 200 },
                        { x: 720, y: 400, width: 20, height: 200 }
                    ],
                    monsters: [
                        { x: 180, y: 50, width: 35, height: 35, speedX: 0, speedY: 2, minX: 150, maxX: 220, minY: 30, maxY: 180 },
                        { x: 400, y: 400, width: 35, height: 35, speedX: 2.5, speedY: 0, minX: 380, maxX: 460, minY: 380, maxY: 550 },
                        { x: 650, y: 150, width: 35, height: 35, speedX: 0, speedY: 2.5, minX: 620, maxX: 700, minY: 100, maxY: 230 }
                    ]
                },
                // Уровень 5 - финальный вызов
                {
                    playerStart: { x: 50, y: 300 },
                    keyPos: { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2 },
                    doorPos: { x: CANVAS_WIDTH - 100, y: CANVAS_HEIGHT - 100 },
                    walls: [
                        { x: 150, y: 0, width: 20, height: 180 },
                        { x: 150, y: 420, width: 20, height: 180 },
                        { x: 300, y: 150, width: 20, height: 300 },
                        { x: 450, y: 0, width: 20, height: 200 },
                        { x: 450, y: 400, width: 20, height: 200 },
                        { x: 600, y: 200, width: 20, height: 200 }
                    ],
                    monsters: [
                        { x: 100, y: 100, width: 35, height: 35, speedX: 2, speedY: 0, minX: 80, maxX: 280, minY: 80, maxY: 180 },
                        { x: 350, y: 50, width: 35, height: 35, speedX: 0, speedY: 2, minX: 330, maxX: 430, minY: 30, maxY: 130 },
                        { x: 650, y: 300, width: 35, height: 35, speedX: 2.5, speedY: 0, minX: 620, maxX: 750, minY: 280, maxY: 380 },
                        { x: 250, y: 500, width: 35, height: 35, speedX: 0, speedY: 2, minX: 230, maxX: 330, minY: 480, maxY: 560 }
                    ]
                }
            ];
            return levels[(level - 1) % levels.length];
        }

        function initLevel(level) {
            const levelData = getLevelData(level);
            
            player.x = levelData.playerStart.x;
            player.y = levelData.playerStart.y;
            key.taken = false;
            door.open = false;
            won = false;
            key.x = levelData.keyPos.x;
            key.y = levelData.keyPos.y;
            door.x = levelData.doorPos.x;
            door.y = levelData.doorPos.y;
            walls = levelData.walls;
            monsters = JSON.parse(JSON.stringify(levelData.monsters));
            
            updateMessage();
            updateLevelInfo();
        }

        function update() {
            if (won) return;
            
            let dx = 0, dy = 0;
            if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) dx = -PLAYER_SPEED;
            if (keysPressed['ArrowRight'] || keysPressed['KeyD']) dx = PLAYER_SPEED;
            if (keysPressed['ArrowUp'] || keysPressed['KeyW']) dy = -PLAYER_SPEED;
            if (keysPressed['ArrowDown'] || keysPressed['KeyS']) dy = PLAYER_SPEED;
            
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }
            
            let newX = player.x + dx;
            let collisionX = false;
            for (let wall of walls) {
                if (checkCollision({ x: newX, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE }, wall)) {
                    collisionX = true;
                    break;
                }
            }
            if (!collisionX && newX >= 0 && newX <= CANVAS_WIDTH - PLAYER_SIZE) {
                player.x = newX;
            }
            
            let newY = player.y + dy;
            let collisionY = false;
            for (let wall of walls) {
                if (checkCollision({ x: player.x, y: newY, width: PLAYER_SIZE, height: PLAYER_SIZE }, wall)) {
                    collisionY = true;
                    break;
                }
            }
            if (!collisionY && newY >= 0 && newY <= CANVAS_HEIGHT - PLAYER_SIZE) {
                player.y = newY;
            }
            
            if (!key.taken && checkCollision(
                { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                key
            )) {
                key.taken = true;
                updateMessage();
            }
            
            if (key.taken && !door.open && checkCollision(
                { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                door
            )) {
                door.open = true;
                won = true;
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        currentLevel = 1;
                    }
                    initLevel(currentLevel);
                }, 1500);
            }

            // Обновление монстров и проверка столкновений
            for (let monster of monsters) {
                // Вычисляем расстояние до игрока
                const dx = player.x - monster.x;
                const dy = player.y - monster.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Если игрок в зоне видимости - преследуем
                if (distance < MONSTER_CHASE_DISTANCE) {
                    // Нормализуем вектор направления
                    const normalizedDx = dx / distance;
                    const normalizedDy = dy / distance;
                    
                    // Движение к игроку
                    monster.x += normalizedDx * MONSTER_CHASE_SPEED;
                    monster.y += normalizedDy * MONSTER_CHASE_SPEED;
                } else {
                    // Патрулирование в пределах зоны
                    monster.x += monster.speedX;
                    monster.y += monster.speedY;
                    
                    // Разворот на границах зоны
                    if (monster.x <= monster.minX || monster.x >= monster.maxX) {
                        monster.speedX *= -1;
                    }
                    if (monster.y <= monster.minY || monster.y >= monster.maxY) {
                        monster.speedY *= -1;
                    }
                }
                
                // Проверка столкновения с игроком
                if (checkCollision(
                    { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                    monster
                )) {
                    // Игрок пойман - начать уровень заново
                    initLevel(currentLevel);
                    updateMessage();
                    return;
                }
            }
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updateMessage() {
            const messageEl = document.getElementById('message');
            if (won) {
                messageEl.textContent = '🎉 ПОБЕДА! Переход на следующий уровень...';
            } else if (key.taken) {
                messageEl.textContent = 'Ключ у тебя! Иди к двери!';
            } else {
                messageEl.textContent = 'Найди золотой ключ!';
            }
        }

        function updateLevelInfo() {
            const levelInfoEl = document.getElementById('levelInfo');
            levelInfoEl.textContent = `Уровень: ${currentLevel} из ${maxLevels}`;
        }

        function draw() {
            // Рисуем пол - сплошной цвет в ретро стиле
            ctx.fillStyle = COLORS.FLOOR;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Рисуем сетку пола (эффект плитки) - более контрастная для ретро стиля
            ctx.strokeStyle = '#3d3d5c';
            ctx.lineWidth = 2;
            const tileSize = 40;
            for (let x = 0; x < CANVAS_WIDTH; x += tileSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += tileSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            // Рисуем стены в ретро стиле - простые прямоугольники
            for (let wall of walls) {
                // Основная часть стены
                ctx.fillStyle = COLORS.WALL;
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
                
                // Контур стены для ретро эффекта
                ctx.strokeStyle = '#8b0000';
                ctx.lineWidth = 2;
                ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);
                
                // Простые кирпичики
                ctx.fillStyle = '#cc5555';
                const brickHeight = 10;
                for (let by = wall.y + 2; by < wall.y + wall.height - 2; by += brickHeight * 2) {
                    ctx.fillRect(wall.x + 3, by + 2, wall.width - 6, 3);
                }
            }
            
            // Рисуем дверь в ретро стиле
            if (door.open) {
                // Открытая дверь - темный проход
                ctx.fillStyle = '#000000';
                ctx.fillRect(door.x, door.y, door.width, door.height);
                // Простая рамка
                ctx.strokeStyle = '#4ecdc4';
                ctx.lineWidth = 2;
                ctx.strokeRect(door.x + 2, door.y + 2, door.width - 4, door.height - 4);
            } else {
                // Закрытая дверь в ретро стиле
                ctx.fillStyle = COLORS.DOOR_LOCKED;
                ctx.fillRect(door.x, door.y, door.width, door.height);
                
                // Рама двери
                ctx.strokeStyle = '#8b0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(door.x, door.y, door.width, door.height);
                
                // Крест-панели на двери (ретро стиль)
                ctx.fillStyle = '#8b0000';
                ctx.fillRect(door.x + door.width/2 - 3, door.y, 6, door.height);
                ctx.fillRect(door.x, door.y + door.height/2 - 3, door.width, 6);
                
                // Золотая ручка
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(door.x + door.width - 10, door.y + door.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Рисуем ключ в ретро стиле
            if (!key.taken) {
                // Основная часть ключа - пиксельный стиль
                ctx.fillStyle = COLORS.KEY;
                ctx.fillRect(key.x, key.y + 8, 12, 6);
                ctx.fillRect(key.x + 12, key.y + 6, 4, 10);
                ctx.fillRect(key.x + 16, key.y + 10, 4, 4);
                ctx.fillRect(key.x + 16, key.y + 6, 4, 4);
                
                // Кольцо ключа
                ctx.strokeStyle = COLORS.KEY;
                ctx.lineWidth = 3;
                ctx.strokeRect(key.x - 4, key.y + 6, 8, 10);
            }
            
            // Рисуем монстров в ретро/пиксельном стиле
            for (let monster of monsters) {
                // Тело монстра - квадратный спрайт
                ctx.fillStyle = COLORS.MONSTER;
                ctx.fillRect(monster.x, monster.y, monster.width, monster.height);
                
                // Контур монстра
                ctx.strokeStyle = '#8b008b';
                ctx.lineWidth = 2;
                ctx.strokeRect(monster.x, monster.y, monster.width, monster.height);
                
                // Злые глаза - простые квадраты
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(monster.x + 6, monster.y + 8, 8, 8);
                ctx.fillRect(monster.x + monster.width - 14, monster.y + 8, 8, 8);
                
                // Зрачки
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(monster.x + 8, monster.y + 10, 4, 4);
                ctx.fillRect(monster.x + monster.width - 12, monster.y + 10, 4, 4);
                
                // Злой рот - простая линия
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(monster.x + 8, monster.y + monster.height - 10, monster.width - 16, 4);
                
                // Рога/шипы
                ctx.fillStyle = '#ff0066';
                ctx.fillRect(monster.x + 4, monster.y - 4, 6, 6);
                ctx.fillRect(monster.x + monster.width - 10, monster.y - 4, 6, 6);
            }
            
            // Рисуем игрока в ретро стиле
            // Тело игрока - квадратный спрайт
            ctx.fillStyle = COLORS.PLAYER;
            ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
            
            // Контур игрока
            ctx.strokeStyle = '#00cc6a';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
            
            // Глаза - простые квадраты
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 6, player.y + 8, 6, 6);
            ctx.fillRect(player.x + PLAYER_SIZE - 12, player.y + 8, 6, 6);
            
            // Зрачки
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 8, player.y + 10, 3, 3);
            ctx.fillRect(player.x + PLAYER_SIZE - 10, player.y + 10, 3, 3);
            
            // Если ключ взят - рисуем его у игрока
            if (key.taken && !won) {
                ctx.fillStyle = COLORS.KEY;
                ctx.fillRect(player.x + PLAYER_SIZE - 8, player.y + PLAYER_SIZE - 10, 6, 8);
            }
            
            // Эффект победы в ретро стиле
            if (won) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                // Простые искры-квадраты
                for (let i = 0; i < 20; i++) {
                    const sparkX = Math.random() * CANVAS_WIDTH;
                    const sparkY = Math.random() * CANVAS_HEIGHT;
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(sparkX, sparkY, 6, 6);
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
