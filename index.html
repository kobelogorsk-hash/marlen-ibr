<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ключ и Дверь</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #2d2d2d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 3px solid #555;
            background: #3a3a3a;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            margin-bottom: 10px;
            text-align: center;
        }
        #message {
            margin-top: 10px;
            font-size: 20px;
            color: #ffd700;
        }
        h1 {
            color: #87CEEB;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🔑 КЛЮЧ И ДВЕРЬ 🚪</h1>
        <p>Управление: Стрелки или WASD | Возьми ключ и открой дверь!</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="message">Найди ключ!</div>

    <script>
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_SPEED = 4;
        const PLAYER_SIZE = 30;
        
        const COLORS = {
            FLOOR: '#3a3a3a',
            WALL: '#555555',
            PLAYER: '#4CAF50',
            KEY: '#FFD700',
            DOOR_LOCKED: '#8B4513',
            DOOR_OPEN: '#654321'
        };

        let canvas, ctx;
        let player = { x: 50, y: 50 };
        let key = { x: 0, y: 0, width: 20, height: 20, taken: false };
        let door = { x: 0, y: 0, width: 40, height: 60, open: false };
        let walls = [];
        let keysPressed = {};
        let won = false;
        
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            
            document.addEventListener('keydown', (e) => {
                keysPressed[e.code] = true;
                if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            });
            document.addEventListener('keyup', (e) => keysPressed[e.code] = false);
            
            initLevel();
            gameLoop();
        };

        function initLevel() {
            player.x = 50;
            player.y = 50;
            key.taken = false;
            door.open = false;
            won = false;
            key.x = CANVAS_WIDTH - 80;
            key.y = CANVAS_HEIGHT - 80;
            door.x = CANVAS_WIDTH - 100;
            door.y = 50;
            walls = [
                { x: 200, y: 0, width: 20, height: 400 },
                { x: 400, y: 200, width: 20, height: 400 },
                { x: 600, y: 0, width: 20, height: 350 },
                { x: 150, y: 450, width: 300, height: 20 }
            ];
            updateMessage();
        }

        function update() {
            if (won) return;
            
            let dx = 0, dy = 0;
            if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) dx = -PLAYER_SPEED;
            if (keysPressed['ArrowRight'] || keysPressed['KeyD']) dx = PLAYER_SPEED;
            if (keysPressed['ArrowUp'] || keysPressed['KeyW']) dy = -PLAYER_SPEED;
            if (keysPressed['ArrowDown'] || keysPressed['KeyS']) dy = PLAYER_SPEED;
            
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }
            
            let newX = player.x + dx;
            let collisionX = false;
            for (let wall of walls) {
                if (checkCollision({ x: newX, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE }, wall)) {
                    collisionX = true;
                    break;
                }
            }
            if (!collisionX && newX >= 0 && newX <= CANVAS_WIDTH - PLAYER_SIZE) {
                player.x = newX;
            }
            
            let newY = player.y + dy;
            let collisionY = false;
            for (let wall of walls) {
                if (checkCollision({ x: player.x, y: newY, width: PLAYER_SIZE, height: PLAYER_SIZE }, wall)) {
                    collisionY = true;
                    break;
                }
            }
            if (!collisionY && newY >= 0 && newY <= CANVAS_HEIGHT - PLAYER_SIZE) {
                player.y = newY;
            }
            
            if (!key.taken && checkCollision(
                { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                key
            )) {
                key.taken = true;
                updateMessage();
            }
            
            if (key.taken && !door.open && checkCollision(
                { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                door
            )) {
                door.open = true;
                won = true;
                updateMessage();
            }
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updateMessage() {
            const messageEl = document.getElementById('message');
            if (won) {
                messageEl.textContent = '🎉 ПОБЕДА! Ты открыл дверь!';
            } else if (key.taken) {
                messageEl.textContent = 'Ключ у тебя! Иди к двери!';
            } else {
                messageEl.textContent = 'Найди золотой ключ!';
            }
        }

        function draw() {
            ctx.fillStyle = COLORS.FLOOR;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.fillStyle = COLORS.WALL;
            for (let wall of walls) {
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
            }
            
            ctx.fillStyle = door.open ? COLORS.DOOR_OPEN : COLORS.DOOR_LOCKED;
            ctx.fillRect(door.x, door.y, door.width, door.height);
            
            if (!door.open) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(door.x + door.width - 10, door.y + door.height / 2, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            if (!key.taken) {
                ctx.fillStyle = COLORS.KEY;
                ctx.fillRect(key.x, key.y + 6, 14, 8);
                ctx.fillRect(key.x + 14, key.y + 4, 6, 12);
                ctx.beginPath();
                ctx.arc(key.x, key.y + 10, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = COLORS.PLAYER;
            ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
            
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 8, 8, 8);
            ctx.fillRect(player.x + 17, player.y + 8, 8, 8);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 7, player.y + 10, 4, 4);
            ctx.fillRect(player.x + 19, player.y + 10, 4, 4);
            
            if (key.taken && !won) {
                ctx.fillStyle = COLORS.KEY;
                ctx.beginPath();
                ctx.arc(player.x + PLAYER_SIZE / 2, player.y - 10, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
