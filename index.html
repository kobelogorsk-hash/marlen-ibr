<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесконечная головоломка</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #555;
            background-color: #333;
        }
        #ui {
            margin-bottom: 10px;
            text-align: center;
        }
        #message {
            margin-top: 10px;
            font-size: 18px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Уровень: <span id="level">1</span></h1>
        <p>Управление: WASD или Стрелки</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="message">Собери ключ!</div>

    <script>
        // ============================================
        // КОНФИГУРАЦИЯ ИГРЫ
        // ============================================
        const TILE_SIZE = 50;        // Размер клетки в пикселях
        const GRID_WIDTH = 15;       // Ширина сетки в клетках
        const GRID_HEIGHT = 12;      // Высота сетки в клетках
        const MONSTER_MOVE_INTERVAL = 500; // Монстры двигаются каждые 0.5 секунды (500 мс)
        
        // Цвета объектов
        const COLORS = {
            PLAYER: '#00ff00',   // Зелёный
            MONSTER: '#ff0000',  // Красный
            KEY: '#ffff00',      // Жёлтый
            DOOR: '#0000ff',     // Синий
            PIT: '#000000',      // Чёрный (пропасть)
            FLOOR: '#333333'     // Тёмно-серый (пол)
        };

        // ============================================
        // СОСТОЯНИЕ ИГРЫ
        // ============================================
        let canvas, ctx;
        let level = 1;
        let player = { x: 0, y: 0 };
        let key = { x: 0, y: 0, collected: false };
        let door = { x: 0, y: 0 };
        let monsters = [];       // Массив монстров {x, y}
        let pits = [];           // Массив пропастей {x, y}
        let hasKey = false;
        let monsterMoveTimer = 0;
        let lastTime = 0;

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Устанавливаем размер канваса
            canvas.width = GRID_WIDTH * TILE_SIZE;
            canvas.height = GRID_HEIGHT * TILE_SIZE;
            
            // Обработчик нажатий клавиш
            document.addEventListener('keydown', handleKeyPress);
            
            // Запуск игрового цикла
            requestAnimationFrame(gameLoop);
            
            // Генерация первого уровня
            generateLevel();
        };

        // ============================================
        // ГЕНЕРАЦИЯ УРОВНЯ
        // ============================================
        function generateLevel() {
            // Сброс состояния
            hasKey = false;
            key.collected = false;
            monsters = [];
            pits = [];
            
            // Количество препятствий увеличивается с уровнем
            const numMonsters = level;           // +1 монстр каждый уровень
            const numPits = 2 + (level - 1) * 2; // +2 пропасти каждый уровень
            
            // Создаём пустую сетку (все клетки проходимы)
            let grid = [];
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    grid[y][x] = 'floor';
                }
            }
            
            // Размещаем игрока в случайной позиции (но не слишком близко к краю)
            player.x = Math.floor(Math.random() * (GRID_WIDTH - 4)) + 2;
            player.y = Math.floor(Math.random() * (GRID_HEIGHT - 4)) + 2;
            grid[player.y][player.x] = 'player';
            
            // Функция для проверки доступности клетки
            function isValidCell(x, y) {
                return x >= 0 && x < GRID_WIDTH && 
                       y >= 0 && y < GRID_HEIGHT && 
                       grid[y][x] === 'floor' &&
                       !(x === player.x && y === player.y);
            }
            
            // Размещаем пропасти
            let placedPits = 0;
            while (placedPits < numPits) {
                let x = Math.floor(Math.random() * GRID_WIDTH);
                let y = Math.floor(Math.random() * GRID_HEIGHT);
                
                if (isValidCell(x, y)) {
                    // Не размещать пропасть рядом с игроком (стартовая зона безопасна)
                    if (Math.abs(x - player.x) + Math.abs(y - player.y) > 2) {
                        grid[y][x] = 'pit';
                        pits.push({ x, y });
                        placedPits++;
                    }
                }
            }
            
            // Размещаем монстров
            let placedMonsters = 0;
            while (placedMonsters < numMonsters) {
                let x = Math.floor(Math.random() * GRID_WIDTH);
                let y = Math.floor(Math.random() * GRID_HEIGHT);
                
                if (isValidCell(x, y)) {
                    // Не размещать монстра слишком близко к игроку
                    if (Math.abs(x - player.x) + Math.abs(y - player.y) > 4) {
                        grid[y][x] = 'monster';
                        monsters.push({ x, y });
                        placedMonsters++;
                    }
                }
            }
            
            // Размещаем ключ (должен быть достижим)
            let keyPlaced = false;
            while (!keyPlaced) {
                let x = Math.floor(Math.random() * GRID_WIDTH);
                let y = Math.floor(Math.random() * GRID_HEIGHT);
                
                if (isValidCell(x, y)) {
                    // Проверяем, что ключ не в тупике (простая эвристика: есть хотя бы 2 соседних пола)
                    let neighbors = 0;
                    if (x > 0 && grid[y][x-1] === 'floor') neighbors++;
                    if (x < GRID_WIDTH-1 && grid[y][x+1] === 'floor') neighbors++;
                    if (y > 0 && grid[y-1][x] === 'floor') neighbors++;
                    if (y < GRID_HEIGHT-1 && grid[y+1][x] === 'floor') neighbors++;
                    
                    if (neighbors >= 2 && Math.abs(x - player.x) + Math.abs(y - player.y) > 3) {
                        key.x = x;
                        key.y = y;
                        key.collected = false;
                        grid[y][x] = 'key';
                        keyPlaced = true;
                    }
                }
            }
            
            // Размещаем дверь (должна быть достижима и не рядом с ключом)
            let doorPlaced = false;
            while (!doorPlaced) {
                let x = Math.floor(Math.random() * GRID_WIDTH);
                let y = Math.floor(Math.random() * GRID_HEIGHT);
                
                if (isValidCell(x, y) && !(x === key.x && y === key.y)) {
                    // Проверяем, что дверь не в тупике
                    let neighbors = 0;
                    if (x > 0 && grid[y][x-1] === 'floor') neighbors++;
                    if (x < GRID_WIDTH-1 && grid[y][x+1] === 'floor') neighbors++;
                    if (y > 0 && grid[y-1][x] === 'floor') neighbors++;
                    if (y < GRID_HEIGHT-1 && grid[y+1][x] === 'floor') neighbors++;
                    
                    if (neighbors >= 2 && Math.abs(x - key.x) + Math.abs(y - key.y) > 3) {
                        door.x = x;
                        door.y = y;
                        grid[y][x] = 'door';
                        doorPlaced = true;
                    }
                }
            }
            
            // Обновляем UI
            document.getElementById('level').textContent = level;
            updateMessage();
        }

        // ============================================
        // ОБРАБОТКА ВВОДА
        // ============================================
        function handleKeyPress(event) {
            let dx = 0, dy = 0;
            
            switch(event.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    dy = -1;
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    dy = 1;
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    dx = -1;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    dx = 1;
                    break;
                default:
                    return; // Не обрабатываем другие клавиши
            }
            
            event.preventDefault();
            movePlayer(dx, dy);
        }

        // ============================================
        // ДВИЖЕНИЕ ИГРОКА
        // ============================================
        function movePlayer(dx, dy) {
            const newX = player.x + dx;
            const newY = player.y + dy;
            
            // Проверка границ
            if (newX < 0 || newX >= GRID_WIDTH || newY < 0 || newY >= GRID_HEIGHT) {
                return;
            }
            
            // Проверка на пропасть
            for (let pit of pits) {
                if (pit.x === newX && pit.y === newY) {
                    return; // Нельзя ходить по пропасти
                }
            }
            
            // Движение разрешено
            player.x = newX;
            player.y = newY;
            
            // Проверка столкновения с монстром
            for (let monster of monsters) {
                if (monster.x === player.x && monster.y === player.y) {
                    restartLevel();
                    return;
                }
            }
            
            // Проверка сбора ключа
            if (!hasKey && key.x === player.x && key.y === player.y) {
                hasKey = true;
                key.collected = true;
                updateMessage();
            }
            
            // Проверка достижения двери
            if (hasKey && door.x === player.x && door.y === player.y) {
                nextLevel();
                return;
            }
        }

        // ============================================
        // ДВИЖЕНИЕ МОНСТРОВ
        // ============================================
        function moveMonsters() {
            for (let monster of monsters) {
                // Вычисляем направление к игроку
                let dx = 0, dy = 0;
                
                if (player.x > monster.x) dx = 1;
                else if (player.x < monster.x) dx = -1;
                
                if (player.y > monster.y) dy = 1;
                else if (player.y < monster.y) dy = -1;
                
                // Монстр двигается по одной оси за раз (сначала X, потом Y)
                let moved = false;
                
                // Пробуем двигаться по X
                if (dx !== 0) {
                    const newX = monster.x + dx;
                    const newY = monster.y;
                    
                    if (canMonsterMoveTo(newX, newY)) {
                        monster.x = newX;
                        monster.y = newY;
                        moved = true;
                    }
                }
                
                // Если не смогли двигаться по X, пробуем Y
                if (!moved && dy !== 0) {
                    const newX = monster.x;
                    const newY = monster.y + dy;
                    
                    if (canMonsterMoveTo(newX, newY)) {
                        monster.x = newX;
                        monster.y = newY;
                    }
                }
                
                // Проверка столкновения с игроком после движения
                if (monster.x === player.x && monster.y === player.y) {
                    restartLevel();
                    return;
                }
            }
        }

        // Проверка, может ли монстр переместиться в клетку
        function canMonsterMoveTo(x, y) {
            // Границы
            if (x < 0 || x >= GRID_WIDTH || y < 0 || y >= GRID_HEIGHT) {
                return false;
            }
            
            // Пропасти
            for (let pit of pits) {
                if (pit.x === x && pit.y === y) {
                    return false;
                }
            }
            
            // Другие монстры
            for (let monster of monsters) {
                if (monster.x === x && monster.y === y) {
                    return false;
                }
            }
            
            return true;
        }

        // ============================================
        // ПЕРЕЗАПУСК И СЛЕДУЮЩИЙ УРОВЕНЬ
        // ============================================
        function restartLevel() {
            // Игрок теряет жизнь - перезапускаем текущий уровень
            player.x = Math.floor(GRID_WIDTH / 2);
            player.y = Math.floor(GRID_HEIGHT / 2);
            
            // Сбрасываем позицию ключа (если был собран)
            hasKey = false;
            key.collected = false;
            
            // Пересоздаём монстров на их исходных позициях
            // Для простоты просто генерируем уровень заново с тем же номером
            generateLevel();
        }

        function nextLevel() {
            level++;
            generateLevel();
        }

        function updateMessage() {
            const messageEl = document.getElementById('message');
            if (hasKey) {
                messageEl.textContent = 'Открой дверь!';
            } else {
                messageEl.textContent = 'Собери ключ!';
            }
        }

        // ============================================
        // ОТРИСОВКА
        // ============================================
        function draw() {
            // Очистка экрана
            ctx.fillStyle = COLORS.FLOOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем пропасти
            ctx.fillStyle = COLORS.PIT;
            for (let pit of pits) {
                ctx.fillRect(pit.x * TILE_SIZE, pit.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
            
            // Рисуем дверь
            ctx.fillStyle = COLORS.DOOR;
            ctx.fillRect(door.x * TILE_SIZE + 5, door.y * TILE_SIZE + 5, TILE_SIZE - 10, TILE_SIZE - 10);
            
            // Рисуем ключ (если ещё не собран)
            if (!key.collected) {
                ctx.fillStyle = COLORS.KEY;
                ctx.beginPath();
                ctx.arc(
                    key.x * TILE_SIZE + TILE_SIZE / 2,
                    key.y * TILE_SIZE + TILE_SIZE / 2,
                    TILE_SIZE / 3,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            // Рисуем монстров
            ctx.fillStyle = COLORS.MONSTER;
            for (let monster of monsters) {
                ctx.fillRect(monster.x * TILE_SIZE + 8, monster.y * TILE_SIZE + 8, TILE_SIZE - 16, TILE_SIZE - 16);
            }
            
            // Рисуем игрока
            ctx.fillStyle = COLORS.PLAYER;
            ctx.fillRect(player.x * TILE_SIZE + 10, player.y * TILE_SIZE + 10, TILE_SIZE - 20, TILE_SIZE - 20);
        }

        // ============================================
        // ИГРОВОЙ ЦИКЛ
        // ============================================
        function gameLoop(timestamp) {
            // Вычисляем дельту времени
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            // Таймер для движения монстров
            monsterMoveTimer += deltaTime;
            if (monsterMoveTimer >= MONSTER_MOVE_INTERVAL) {
                moveMonsters();
                monsterMoveTimer = 0;
            }
            
            // Отрисовка
            draw();
            
            // Продолжаем цикл
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
