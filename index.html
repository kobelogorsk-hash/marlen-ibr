<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ключ и Дверь</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            border: 4px solid #e94560;
            background: #2d2d44;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4), 0 10px 40px rgba(0,0,0,0.6);
            border-radius: 8px;
        }
        #ui {
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #message {
            margin-top: 15px;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-weight: bold;
        }
        h1 {
            color: #e94560;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        p {
            margin: 5px 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🔑 КЛЮЧ И ДВЕРЬ 🚪</h1>
        <p>Управление: Стрелки или WASD | Возьми ключ и открой дверь! Избегай монстров!</p>
        <p id="levelInfo">Уровень: 1</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="message">Найди ключ!</div>

    <script>
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_SPEED = 4;
        const PLAYER_SIZE = 30;
        
        const COLORS = {
            FLOOR: '#2d2d44',
            WALL: '#e94560',
            PLAYER: '#00ff88',
            KEY: '#ffd700',
            DOOR_LOCKED: '#ff6b6b',
            DOOR_OPEN: '#4ecdc4',
            MONSTER: '#ff00ff'
        };

        let canvas, ctx;
        let player = { x: 50, y: 50 };
        let key = { x: 0, y: 0, width: 20, height: 20, taken: false };
        let door = { x: 0, y: 0, width: 40, height: 60, open: false };
        let walls = [];
        let monsters = [];
        let keysPressed = {};
        let won = false;
        let currentLevel = 1;
        let maxLevels = 5;
        
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            
            document.addEventListener('keydown', (e) => {
                keysPressed[e.code] = true;
                if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            });
            document.addEventListener('keyup', (e) => keysPressed[e.code] = false);
            
            initLevel(currentLevel);
            gameLoop();
        };

        function getLevelData(level) {
            const levels = [
                // Уровень 1 - простой
                {
                    playerStart: { x: 50, y: 50 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: CANVAS_HEIGHT - 80 },
                    doorPos: { x: CANVAS_WIDTH - 100, y: 50 },
                    walls: [
                        { x: 200, y: 0, width: 20, height: 400 },
                        { x: 400, y: 200, width: 20, height: 400 },
                        { x: 600, y: 0, width: 20, height: 350 },
                        { x: 150, y: 450, width: 300, height: 20 }
                    ],
                    monsters: []
                },
                // Уровень 2 - с одним монстром
                {
                    playerStart: { x: 50, y: 50 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: 80 },
                    doorPos: { x: 80, y: CANVAS_HEIGHT - 100 },
                    walls: [
                        { x: 150, y: 0, width: 20, height: 300 },
                        { x: 300, y: 150, width: 350, height: 20 },
                        { x: 500, y: 300, width: 20, height: 300 },
                        { x: 200, y: 450, width: 250, height: 20 }
                    ],
                    monsters: [
                        { x: 400, y: 200, width: 35, height: 35, speedX: 2, speedY: 0, minX: 250, maxX: 550, minY: 180, maxY: 280 }
                    ]
                },
                // Уровень 3 - больше стен и два монстра
                {
                    playerStart: { x: 50, y: 300 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: CANVAS_HEIGHT - 80 },
                    doorPos: { x: CANVAS_WIDTH - 100, y: 50 },
                    walls: [
                        { x: 150, y: 0, width: 20, height: 250 },
                        { x: 150, y: 350, width: 20, height: 250 },
                        { x: 350, y: 100, width: 20, height: 400 },
                        { x: 550, y: 0, width: 20, height: 250 },
                        { x: 550, y: 350, width: 20, height: 250 },
                        { x: 200, y: 280, width: 130, height: 20 },
                        { x: 400, y: 300, width: 130, height: 20 }
                    ],
                    monsters: [
                        { x: 200, y: 100, width: 35, height: 35, speedX: 0, speedY: 2.5, minX: 180, maxX: 320, minY: 50, maxY: 250 },
                        { x: 600, y: 400, width: 35, height: 35, speedX: 3, speedY: 0, minX: 580, maxX: 750, minY: 380, maxY: 480 }
                    ]
                },
                // Уровень 4 - лабиринт с тремя монстрами
                {
                    playerStart: { x: 50, y: 50 },
                    keyPos: { x: CANVAS_WIDTH - 80, y: CANVAS_HEIGHT - 80 },
                    doorPos: { x: 50, y: CANVAS_HEIGHT - 100 },
                    walls: [
                        { x: 120, y: 0, width: 20, height: 400 },
                        { x: 240, y: 200, width: 20, height: 400 },
                        { x: 360, y: 0, width: 20, height: 350 },
                        { x: 480, y: 150, width: 20, height: 450 },
                        { x: 600, y: 0, width: 20, height: 300 },
                        { x: 720, y: 250, width: 20, height: 350 },
                        { x: 100, y: 500, width: 200, height: 20 },
                        { x: 400, y: 80, width: 150, height: 20 }
                    ],
                    monsters: [
                        { x: 180, y: 50, width: 35, height: 35, speedX: 0, speedY: 2, minX: 150, maxX: 220, minY: 30, maxY: 180 },
                        { x: 400, y: 400, width: 35, height: 35, speedX: 2.5, speedY: 0, minX: 380, maxX: 460, minY: 380, maxY: 550 },
                        { x: 650, y: 150, width: 35, height: 35, speedX: 0, speedY: 3, minX: 620, maxX: 700, minY: 100, maxY: 230 }
                    ]
                },
                // Уровень 5 - сложный с четырьмя монстрами
                {
                    playerStart: { x: 50, y: 300 },
                    keyPos: { x: CANVAS_WIDTH / 2 - 10, y: CANVAS_HEIGHT / 2 - 10 },
                    doorPos: { x: CANVAS_WIDTH - 100, y: CANVAS_HEIGHT - 100 },
                    walls: [
                        { x: 150, y: 0, width: 20, height: 200 },
                        { x: 150, y: 400, width: 20, height: 200 },
                        { x: 300, y: 150, width: 20, height: 300 },
                        { x: 450, y: 0, width: 20, height: 250 },
                        { x: 450, y: 350, width: 20, height: 250 },
                        { x: 600, y: 200, width: 20, height: 250 },
                        { x: 200, y: 280, width: 80, height: 20 },
                        { x: 500, y: 280, width: 80, height: 20 },
                        { x: 350, y: 450, width: 150, height: 20 }
                    ],
                    monsters: [
                        { x: 100, y: 100, width: 35, height: 35, speedX: 2, speedY: 0, minX: 80, maxX: 280, minY: 80, maxY: 180 },
                        { x: 350, y: 50, width: 35, height: 35, speedX: 0, speedY: 2.5, minX: 330, maxX: 430, minY: 30, maxY: 130 },
                        { x: 650, y: 300, width: 35, height: 35, speedX: 3, speedY: 0, minX: 620, maxX: 750, minY: 280, maxY: 380 },
                        { x: 250, y: 500, width: 35, height: 35, speedX: 0, speedY: 2, minX: 230, maxX: 330, minY: 480, maxY: 560 }
                    ]
                }
            ];
            return levels[(level - 1) % levels.length];
        }

        function initLevel(level) {
            const levelData = getLevelData(level);
            
            player.x = levelData.playerStart.x;
            player.y = levelData.playerStart.y;
            key.taken = false;
            door.open = false;
            won = false;
            key.x = levelData.keyPos.x;
            key.y = levelData.keyPos.y;
            door.x = levelData.doorPos.x;
            door.y = levelData.doorPos.y;
            walls = levelData.walls;
            monsters = JSON.parse(JSON.stringify(levelData.monsters));
            
            updateMessage();
            updateLevelInfo();
        }

        function update() {
            if (won) return;
            
            let dx = 0, dy = 0;
            if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) dx = -PLAYER_SPEED;
            if (keysPressed['ArrowRight'] || keysPressed['KeyD']) dx = PLAYER_SPEED;
            if (keysPressed['ArrowUp'] || keysPressed['KeyW']) dy = -PLAYER_SPEED;
            if (keysPressed['ArrowDown'] || keysPressed['KeyS']) dy = PLAYER_SPEED;
            
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }
            
            let newX = player.x + dx;
            let collisionX = false;
            for (let wall of walls) {
                if (checkCollision({ x: newX, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE }, wall)) {
                    collisionX = true;
                    break;
                }
            }
            if (!collisionX && newX >= 0 && newX <= CANVAS_WIDTH - PLAYER_SIZE) {
                player.x = newX;
            }
            
            let newY = player.y + dy;
            let collisionY = false;
            for (let wall of walls) {
                if (checkCollision({ x: player.x, y: newY, width: PLAYER_SIZE, height: PLAYER_SIZE }, wall)) {
                    collisionY = true;
                    break;
                }
            }
            if (!collisionY && newY >= 0 && newY <= CANVAS_HEIGHT - PLAYER_SIZE) {
                player.y = newY;
            }
            
            if (!key.taken && checkCollision(
                { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                key
            )) {
                key.taken = true;
                updateMessage();
            }
            
            if (key.taken && !door.open && checkCollision(
                { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                door
            )) {
                door.open = true;
                won = true;
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        currentLevel = 1;
                    }
                    initLevel(currentLevel);
                }, 1500);
            }

            // Обновление монстров и проверка столкновений
            for (let monster of monsters) {
                // Движение монстра
                monster.x += monster.speedX;
                monster.y += monster.speedY;
                
                // Патрулирование в пределах зоны
                if (monster.x <= monster.minX || monster.x >= monster.maxX) {
                    monster.speedX *= -1;
                }
                if (monster.y <= monster.minY || monster.y >= monster.maxY) {
                    monster.speedY *= -1;
                }
                
                // Проверка столкновения с игроком
                if (checkCollision(
                    { x: player.x, y: player.y, width: PLAYER_SIZE, height: PLAYER_SIZE },
                    monster
                )) {
                    // Игрок пойман - начать уровень заново
                    initLevel(currentLevel);
                    updateMessage();
                    return;
                }
            }
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updateMessage() {
            const messageEl = document.getElementById('message');
            if (won) {
                messageEl.textContent = '🎉 ПОБЕДА! Переход на следующий уровень...';
            } else if (key.taken) {
                messageEl.textContent = 'Ключ у тебя! Иди к двери!';
            } else {
                messageEl.textContent = 'Найди золотой ключ!';
            }
        }

        function updateLevelInfo() {
            const levelInfoEl = document.getElementById('levelInfo');
            levelInfoEl.textContent = `Уровень: ${currentLevel} из ${maxLevels}`;
        }

        function draw() {
            // Рисуем пол с текстурой плитки
            ctx.fillStyle = COLORS.FLOOR;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Рисуем сетку пола (эффект плитки)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const tileSize = 40;
            for (let x = 0; x < CANVAS_WIDTH; x += tileSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += tileSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            // Рисуем стены с эффектом объема
            for (let wall of walls) {
                // Тень стены
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(wall.x + 4, wall.y + 4, wall.width, wall.height);
                
                // Основная часть стены
                ctx.fillStyle = COLORS.WALL;
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
                
                // Блик сверху
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(wall.x, wall.y, wall.width, 4);
                
                // Декоративные элементы на стенах
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                const brickHeight = 8;
                for (let by = wall.y; by < wall.y + wall.height; by += brickHeight * 2) {
                    ctx.fillRect(wall.x + 2, by + 2, wall.width - 4, 2);
                }
            }
            
            // Рисуем дверь
            if (door.open) {
                // Открытая дверь - темный проход
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(door.x, door.y, door.width, door.height);
                // Свет из прохода
                ctx.fillStyle = 'rgba(78, 205, 196, 0.3)';
                ctx.fillRect(door.x + 5, door.y + 5, door.width - 10, door.height - 10);
            } else {
                // Закрытая дверь с деталями
                // Тень
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(door.x + 3, door.y + 3, door.width, door.height);
                
                // Основная дверь
                ctx.fillStyle = COLORS.DOOR_LOCKED;
                ctx.fillRect(door.x, door.y, door.width, door.height);
                
                // Рама двери
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 3;
                ctx.strokeRect(door.x + 2, door.y + 2, door.width - 4, door.height - 4);
                
                // Панели на двери
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(door.x + 5, door.y + 8, door.width - 10, 18);
                ctx.fillRect(door.x + 5, door.y + 32, door.width - 10, 18);
                
                // Золотая ручка/замок
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(door.x + door.width - 12, door.y + door.height / 2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#b8860b';
                ctx.beginPath();
                ctx.arc(door.x + door.width - 12, door.y + door.height / 2, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Рисуем ключ
            if (!key.taken) {
                // Свечение вокруг ключа
                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(key.x + 10, key.y + 10, 18, 0, Math.PI * 2);
                ctx.fill();
                
                // Основная часть ключа
                ctx.fillStyle = COLORS.KEY;
                ctx.fillRect(key.x, key.y + 6, 14, 8);
                ctx.fillRect(key.x + 14, key.y + 4, 6, 12);
                ctx.beginPath();
                ctx.arc(key.x, key.y + 10, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Блик на ключе
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(key.x - 2, key.y + 8, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Рисуем монстров
            for (let monster of monsters) {
                // Тень монстра
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(monster.x + monster.width / 2, monster.y + monster.height + 3, monster.width / 2, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Тело монстра (вид сверху) - злой красный/фиолетовый круг
                ctx.fillStyle = COLORS.MONSTER;
                ctx.beginPath();
                ctx.arc(monster.x + monster.width / 2, monster.y + monster.height / 2, monster.width / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Обводка монстра
                ctx.strokeStyle = '#cc00cc';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Злые глаза монстра
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(monster.x + monster.width / 2 - 8, monster.y + monster.height / 2 - 3, 6, 0, Math.PI * 2);
                ctx.arc(monster.x + monster.width / 2 + 8, monster.y + monster.height / 2 - 3, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Зрачки монстра
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(monster.x + monster.width / 2 - 7, monster.y + monster.height / 2 - 2, 3, 0, Math.PI * 2);
                ctx.arc(monster.x + monster.width / 2 + 9, monster.y + monster.height / 2 - 2, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Злой рот
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(monster.x + monster.width / 2, monster.y + monster.height / 2 + 8, 10, 0.2 * Math.PI, 0.8 * Math.PI);
                ctx.stroke();
                
                // Шипы/рога
                ctx.fillStyle = '#ff0066';
                ctx.beginPath();
                ctx.moveTo(monster.x + monster.width / 2 - 10, monster.y + 5);
                ctx.lineTo(monster.x + monster.width / 2 - 5, monster.y - 5);
                ctx.lineTo(monster.x + monster.width / 2, monster.y + 5);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(monster.x + monster.width / 2 + 10, monster.y + 5);
                ctx.lineTo(monster.x + monster.width / 2 + 5, monster.y - 5);
                ctx.lineTo(monster.x + monster.width / 2, monster.y + 5);
                ctx.fill();
            }
            
            // Рисуем игрока
            // Тень игрока
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE + 3, PLAYER_SIZE / 2, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Тело игрока (вид сверху)
            ctx.fillStyle = COLORS.PLAYER;
            ctx.beginPath();
            ctx.arc(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, PLAYER_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Обводка игрока
            ctx.strokeStyle = '#00cc6a';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Глаза (вид сверху)
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x + PLAYER_SIZE / 2 - 6, player.y + PLAYER_SIZE / 2 - 2, 5, 0, Math.PI * 2);
            ctx.arc(player.x + PLAYER_SIZE / 2 + 6, player.y + PLAYER_SIZE / 2 - 2, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Зрачки
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(player.x + PLAYER_SIZE / 2 - 5, player.y + PLAYER_SIZE / 2 - 2, 3, 0, Math.PI * 2);
            ctx.arc(player.x + PLAYER_SIZE / 2 + 7, player.y + PLAYER_SIZE / 2 - 2, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Блик в глазах
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x + PLAYER_SIZE / 2 - 4, player.y + PLAYER_SIZE / 2 - 4, 1.5, 0, Math.PI * 2);
            ctx.arc(player.x + PLAYER_SIZE / 2 + 8, player.y + PLAYER_SIZE / 2 - 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Если ключ взят - рисуем его у игрока
            if (key.taken && !won) {
                ctx.fillStyle = COLORS.KEY;
                // Свечение
                ctx.shadowColor = COLORS.KEY;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(player.x + PLAYER_SIZE / 2, player.y - 8, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Детали ключа
                ctx.fillStyle = '#b8860b';
                ctx.beginPath();
                ctx.arc(player.x + PLAYER_SIZE / 2, player.y - 8, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Эффект победы
            if (won) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.1)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                // Искры
                for (let i = 0; i < 20; i++) {
                    const sparkX = Math.random() * CANVAS_WIDTH;
                    const sparkY = Math.random() * CANVAS_HEIGHT;
                    ctx.fillStyle = `hsl(${Math.random() * 60 + 40}, 100%, 50%)`;
                    ctx.beginPath();
                    ctx.arc(sparkX, sparkY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
